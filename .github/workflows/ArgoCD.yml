name: CI - GitOps Robot Shop

on:
  push:
    branches: [ master ]
    paths:
      - 'services/**'
      - '!infra/helm/**'
  workflow_dispatch:

env:
  REGISTRY: mgrobotsshopcontainerregistry.azurecr.io

jobs:

# ---------------- DETECT CHANGES ----------------
  detect:
    runs-on:
      - self-hosted
      - linux
      - aks-private
    outputs:
      services: ${{ steps.filter.outputs.changes }}

    steps:
      - uses: actions/checkout@v3

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            cart: services/cart/**
            catalogue: services/catalogue/**
            user: services/user/**
            payment: services/payment/**
            shipping: services/shipping/**
            ratings: services/ratings/**
            dispatch: services/dispatch/**
            web: services/web/**

# ---------------- BUILD + UPDATE + PUSH ----------------
  build:
    needs: detect
    runs-on:
      - self-hosted
      - linux
      - aks-private
    if: needs.detect.outputs.services != ''

    strategy:
      matrix:
        service: [cart, catalogue, user, payment, shipping, ratings, dispatch, web]

    steps:
      - uses: actions/checkout@v3

      - name: Check if service changed
        id: check
        run: |
          echo '${{ needs.detect.outputs.services }}' > changes.json
          echo "changed=$(jq -r '.${{ matrix.service }} // false' changes.json)" >> $GITHUB_OUTPUT

      - name: Login to ACR
        if: steps.check.outputs.changed == 'true'
        run: az acr login --name mgrobotsshopcontainerregistry

      - name: Setup Buildx
        if: steps.check.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Image
        if: steps.check.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}

      - name: Trivy Scan
        if: steps.check.outputs.changed == 'true'
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Update image tag in values.yaml
        if: steps.check.outputs.changed == 'true'
        env:
          SERVICE: ${{ matrix.service }}
          SHA: ${{ github.sha }}
        run: |
          which yq || sudo snap install yq

          if [ "$SERVICE" = "web" ]; then
            yq -i ".web.tag = \"$SHA\"" infra/helm/values.yaml
          else
            yq -i ".services.$SERVICE.tag = \"$SHA\"" infra/helm/values.yaml
          fi

      - name: Commit & Push
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Mahmoud Gamal"
          git config user.email "mahmoudgamal2727@gmail.com"
          
          # Set remote URL with token
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/MahmoudG27/Robots-Shop.git

          for i in 1 2 3; do
            git pull --rebase origin master
            git add infra/helm/values.yaml
            git commit -m "Update ${{ matrix.service }} tag to ${{ github.sha }}" || echo "No changes"
            git push && break || sleep $((i * 5))
          done