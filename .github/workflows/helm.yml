name: Helm CI/CD - Robot Shop

on:
  # push:
  #   branches: [ master ]
  workflow_dispatch:

env:
  REGISTRY: containerregistryrobots.azurecr.io

# ---------------- DETECT CHANGES ----------------
jobs:
  detect:
    runs-on: ubuntu-latest

    outputs:
      services: ${{ steps.filter.outputs.changes }}

    steps:
      - uses: actions/checkout@v3

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            cart: services/cart/**
            catalogue: services/catalogue/**
            user: services/user/**
            payment: services/payment/**
            shipping: services/shipping/**
            ratings: services/ratings/**
            dispatch: services/dispatch/**
            web: services/web/**

# ---------------- BUILD + SCAN + PUSH ----------------
  build:
    needs: detect
    runs-on: ubuntu-latest
    if: needs.detect.outputs.services != ''

    strategy:
      matrix:
        service: [cart, catalogue, user, payment, shipping, ratings, dispatch, web]

    steps:
      - uses: actions/checkout@v3

      # -------- check if service changed --------
      - name: Check if service changed
        id: check
        run: |
          echo '${{ needs.detect.outputs.services }}' > changes.json
          echo "changed=$(jq -r '.${{ matrix.service }} // false' changes.json)" >> $GITHUB_OUTPUT

      # -------- login ACR --------
      - name: Login to ACR
        if: steps.check.outputs.changed == 'true'
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login $REGISTRY \
          -u "${{ secrets.ACR_USERNAME }}" --password-stdin

      # -------- setup buildx --------
      - name: Setup Buildx
        if: steps.check.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      # -------- build & push --------
      - name: Build & Push Image
        if: steps.check.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -------- security scan --------
      - name: Trivy Scan
        if: steps.check.outputs.changed == 'true'
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1

# ---------------- DEPLOY DEV ----------------
  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v3

      # -------- helm & kubectl --------
      - uses: azure/setup-helm@v4
      - uses: azure/setup-kubectl@v4

      # -------- kubeconfig fix --------
      - name: Configure Kubernetes
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DEV }}" > ~/.kube/config

      # -------- helm lint --------
      - name: Helm Lint
        run: helm lint ./infra/helm

      # -------- deploy --------
      - name: Helm Deploy
        run: |
          helm upgrade --install robot-shop ./infra/helm \
            --namespace dev \
            --create-namespace \
            --set global.imageTag=${{ github.sha }} \
            --atomic \
            --timeout 5m