apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: robot-shop
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/MahmoudG27/Robots-Shop.git
    targetRevision: master
    path: infra/helm

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

  ignoreDifferences:
  - group: batch
    kind: Job