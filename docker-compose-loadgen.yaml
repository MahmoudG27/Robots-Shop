version: '3.8'
services:
  load:
    build: ./load-gen
    image: robots/load-gen:v1
    container_name: load-gen
    environment:
      HOST: http://web:8080
    networks:
      - robot-shop
    depends_on:
      - web
    logging: &logging
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "2"