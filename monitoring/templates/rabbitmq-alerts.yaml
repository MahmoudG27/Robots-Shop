apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: rabbitmq-alerts
  labels:
    release: monitoring
spec:
  groups:
  - name: rabbitmq.rules
    rules:
    - alert: RabbitMQQueueHigh
      expr: rabbitmq_queue_messages_ready > 100
      for: 2m
      labels:
        severity: warning

    - alert: RabbitMQNoConsumers
      expr: rabbitmq_queue_consumers == 0
      for: 1m
      labels:
        severity: critical