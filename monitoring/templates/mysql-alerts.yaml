apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mysql-alerts
  labels:
    release: monitoring
spec:
  groups:
  - name: mysql.rules
    rules:

    # High Connections
    - alert: MySQLHighConnections
      expr: |
        mysql_global_status_threads_connected
        /
        mysql_global_variables_max_connections > 0.8
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "MySQL high connections"
        description: "Connections > 80% of max"

    # Too many running threads
    - alert: MySQLTooManyRunningThreads
      expr: mysql_global_status_threads_running > 20
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "Too many running threads"
        description: "MySQL threads_running is high"

    # Slow queries
    - alert: MySQLSlowQueriesHigh
      expr: rate(mysql_global_status_slow_queries[5m]) > 5
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "High slow queries rate"
        description: "Too many slow queries"

    # Disk reads (buffer miss)
    - alert: MySQLHighDiskReads
      expr: rate(mysql_global_status_innodb_buffer_pool_reads[5m]) > 10
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "High disk reads"
        description: "InnoDB reading from disk frequently"

    # Temp tables on disk
    - alert: MySQLHighTempTables
      expr: rate(mysql_global_status_created_tmp_disk_tables[5m]) > 5
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "Too many temp tables on disk"
        description: "Query optimization issue"

    # MySQL down
    - alert: MySQLDown
      expr: up{job="mysql-exporter"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "MySQL is down"
        description: "Exporter cannot reach MySQL"