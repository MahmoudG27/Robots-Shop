apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-init-ratings
spec:
  template:
    spec:
      containers:
      - name: mysql-init-container
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: root-password
        - name: MYSQL_RATINGS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: ratings-password
        - name: MYSQL_HOST
          value: "mysql"
        - name: MYSQL_USER
          value: "ratings"
        - name: MYSQL_PORT
          value: "3306"
        command: ["/bin/sh", "-c"]
        args:
        - |
          until mysql -h${MYSQL_HOST} -P${MYSQL_PORT} -u root -p${MYSQL_ROOT_PASSWORD} -e "SELECT 1;" &> /dev/null
          do
            echo "Waiting for MySQL to be ready..."
            sleep 3
          done

          mysql -h${MYSQL_HOST} -P${MYSQL_PORT} -u root -p${MYSQL_ROOT_PASSWORD} <<EOF
          CREATE DATABASE IF NOT EXISTS ratings;
          CREATE USER IF NOT EXISTS '${MYSQL_USER}'@'%' IDENTIFIED BY '${MYSQL_RATINGS_PASSWORD}';
          GRANT ALL PRIVILEGES ON ratings.* TO '${MYSQL_USER}'@'%';
          FLUSH PRIVILEGES;
          USE ratings;
          CREATE TABLE IF NOT EXISTS ratings (
            sku VARCHAR(80) NOT NULL,
            avg_rating DECIMAL(3,2) NOT NULL,
            rating_count INT NOT NULL,
            PRIMARY KEY (sku)
          ) ENGINE=InnoDB;
          EOF
      restartPolicy: OnFailure