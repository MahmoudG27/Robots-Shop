apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  labels:
    app: rabbitmq
spec:
  serviceName: rabbitmq
  replicas: {{ .Values.messaging.rabbitmq.replicas }}
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: "{{ .Values.messaging.rabbitmq.image.repository }}:{{ .Values.messaging.rabbitmq.image.tag }}"

        ports:
        - containerPort: {{ .Values.messaging.rabbitmq.service.amqpPort }}
          name: amqp
        - containerPort: {{ .Values.messaging.rabbitmq.service.managementPort }}
          name: management
        - containerPort: {{ .Values.messaging.rabbitmq.service.metricsPort }}
          name: metrics

        env:
        - name: RABBITMQ_PROMETHEUS
          value: "true"
        - name: RABBITMQ_DEFAULT_USER
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: RABBITMQ_DEFAULT_USER

        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: RABBITMQ_DEFAULT_PASS

        volumeMounts:
        - name: rabbitmq-data
          mountPath: /var/lib/rabbitmq

        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1024Mi"

        # ---------------- PROBES ----------------
        livenessProbe:
          exec:
            command: ["rabbitmq-diagnostics", "ping"]
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 15
          failureThreshold: 6

        readinessProbe:
          exec:
            command: ["rabbitmq-diagnostics", "check_running"]
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3

  volumeClaimTemplates:
  - metadata:
      name: rabbitmq-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: {{ .Values.storageClassName }}
      resources:
        requests:
          storage: {{ .Values.messaging.rabbitmq.storage }}