{{- range $name, $svc := .Values.services }}

{{- $defaults := $.Values.services.defaults }}
{{- $svc = merge $defaults $svc }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}

spec:
  replicas: {{ $svc.replicas }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: {{ $name }}

  template:
    metadata:
      labels:
        app: {{ $name }}

    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: {{ $name }}
          image: image: {{ $svc.image }}:{{ $svc.tag | default $.Values.global.imageTag }}.
          imagePullPolicy: IfNotPresent

          ports:
            {{- range $p := $svc.ports }}
            - containerPort: {{ $p.port }}
            {{- end }}

          # ---------------- ENV ----------------
          env:
            {{- range $key, $value := $svc.env }}
            - name: {{ $key }}
              value: "{{ $value }}"
            {{- end }}

            {{- range $s := $svc.secrets }}
            - name: {{ $s.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $s.secret }}
                  key: {{ $s.key }}
            {{- end }}

          # ---------------- RESOURCES ----------------
          resources:
            {{- toYaml $svc.resources | nindent 12 }}

          # ---------------- PROBES ----------------
          {{- if $svc.probes.enabled }}
          startupProbe:
            httpGet:
              path: {{ $svc.probes.startupPath }}
              port: {{ (index $svc.ports 0).port }}
            failureThreshold: 30
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: {{ $svc.probes.livenessPath }}
              port: {{ (index $svc.ports 0).port }}
            initialDelaySeconds: 80
            periodSeconds: 20

          readinessProbe:
            httpGet:
              path: {{ $svc.probes.readinessPath }}
              port: {{ (index $svc.ports 0).port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 10
          {{- end }}

---
{{- end }}