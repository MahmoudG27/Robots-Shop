apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    app: rabbitmq
spec:
  clusterIP: None
  selector:
    app: rabbitmq
  ports:
  - name: amqp
    port: {{ .Values.messaging.rabbitmq.service.amqpPort }}
    targetPort: {{ .Values.messaging.rabbitmq.service.amqpPort }}
  - name: management
    port: {{ .Values.messaging.rabbitmq.service.managementPort }}
    targetPort: {{ .Values.messaging.rabbitmq.service.managementPort }}
  - name: metrics
    port: {{ .Values.messaging.rabbitmq.service.metricsPort }}
    targetPort: {{ .Values.messaging.rabbitmq.service.metricsPort }}