apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  labels:
    app: cart
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cart
  template:
    metadata:
      labels:
        app: cart
    spec:
      terminationGracePeriodSeconds: 30

      containers:
      - name: cart
        image: containerregistryrobots.azurecr.io/cart:v1.0.0
        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 8080

        env:
        - name: REDIS_HOST
          value: redis
        - name: CATALOGUE_HOST
          value: catalogue
        - name: CART_SERVER_PORT
          value: "8080"

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"

        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3